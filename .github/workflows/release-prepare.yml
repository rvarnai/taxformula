on:
  workflow_dispatch:
    inputs:
      next_version_bump:
        description: 'Version increment for the next development cycle'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: minor

      override_version:
        description: 'Optional release version override (e.g. 1.0.1)'
        required: false
        type: string

permissions: {}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@d137f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Determine release version
        id: version
        env:
          OVERRIDE_VERSION: ${{ inputs.override_version }}
        run: |
          CURRENT_VERSION=$(./mvnw help:evaluate \
            -Dexpression=project.version \
            -q -DforceStdout)
    
          if [[ ! "$CURRENT_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-SNAPSHOT$ ]]; then
            echo "POM must contain a stable SNAPSHOT version."
            exit 1
          fi
    
          CURRENT_BASE="${CURRENT_VERSION%-SNAPSHOT}"
    
          if [[ -n "$OVERRIDE_VERSION" ]]; then
            if [[ ! "$OVERRIDE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Invalid stable release version: $OVERRIDE_VERSION"
              exit 1
            fi
            RELEASE_VERSION="$OVERRIDE_VERSION"
          else
            RELEASE_VERSION="$CURRENT_BASE"
          fi
    
          TAG="v$RELEASE_VERSION"
          BRANCH="release/$RELEASE_VERSION"
    
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $TAG"
            exit 1
          fi
    
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Release branch already exists: $BRANCH"
            exit 1
          fi
    
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Update Maven version
        run: |
          ./mvnw versions:set \
            -DnewVersion=${{ steps.version.outputs.release_version }} \
            -DgenerateBackupPoms=false

      - name: Build and verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Create release branch
        env:
          RELEASE_BRANCH: ${{ steps.version.outputs.release_branch }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    
          git switch -c "$RELEASE_BRANCH"
    
          git add pom.xml
          git commit -m "chore(release): prepare v$RELEASE_VERSION"
    
          git push origin "$RELEASE_BRANCH"

      - name: Create release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.version.outputs.release_branch }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          NEXT_BUMP: ${{ inputs.next_version_bump }}
        run: |
          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "release: prepare v$RELEASE_VERSION" \
            --body "## Release preparation: v$RELEASE_VERSION
    
          - [x] Update Maven version
          - [x] Maven verification successful
          - [ ] Review changes
          - [ ] Merge release PR
          - [ ] Create tag v$RELEASE_VERSION
    
          Next development version will use a $NEXT_BUMP increment."
