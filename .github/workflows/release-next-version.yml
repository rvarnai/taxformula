name: Prepare Next Development Version

on:
  workflow_run:
    workflows: ["Tax Formula Release"]
    types:
      - completed
  workflow_dispatch:

permissions: {}

jobs:
  prepare:
    name: Prepare next development version
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Determine released version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main --tags

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual execution: finding latest stable release on main."

            RELEASE_TAG=""

            while IFS= read -r COMMIT; do
              CANDIDATE=$(git tag --points-at "$COMMIT" \
                | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
                | sort -V \
                | tail -n 1 || true)

              if [[ -n "$CANDIDATE" ]]; then
                RELEASE_TAG="$CANDIDATE"
                break
              fi
            done < <(git rev-list --first-parent origin/main)

          else
            echo "Automatic execution: using triggering release commit."

            RELEASE_TAG=$(git tag --points-at "$RELEASE_SHA" \
              | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
              | head -n 1)
          fi

          if [[ -z "$RELEASE_TAG" ]]; then
            echo "::error::No stable release tag found."
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          RELEASE_BRANCH="release/$RELEASE_VERSION"

          echo "Detected release: $RELEASE_TAG"

          PR_NUMBER=$(gh pr list \
            --state merged \
            --base main \
            --head "$RELEASE_BRANCH" \
            --json number \
            --jq '.[0].number // empty')

          if [[ -z "$PR_NUMBER" ]]; then
            echo "::error::Could not find merged release PR for $RELEASE_BRANCH."
            exit 1
          fi

          echo "Found release PR: #$PR_NUMBER"

          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body')

          echo "Extracting next version increment."

          if [[ "$PR_BODY" =~ \<!--[[:space:]]*next-version-bump:[[:space:]]*(patch|minor|major)[[:space:]]*--\> ]]; then
            NEXT_BUMP="${BASH_REMATCH[1]}"
          else
            echo "::error::Could not determine next version increment from PR #$PR_NUMBER."
            exit 1
          fi

          echo "Release version: $RELEASE_VERSION"
          echo "Next version bump: $NEXT_BUMP"

          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "next_bump=$NEXT_BUMP" >> "$GITHUB_OUTPUT"

      - name: Calculate next development version
        id: next
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          NEXT_BUMP: ${{ steps.version.outputs.next_bump }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$RELEASE_VERSION"

          case "$NEXT_BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEXT_VERSION="$MAJOR.$MINOR.$PATCH-SNAPSHOT"
          BRANCH="chore/next-version-$NEXT_VERSION"

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Update Maven version
        env:
          NEXT_VERSION: ${{ steps.next.outputs.version }}
        run: |
          ./mvnw versions:set \
            -DnewVersion="$NEXT_VERSION" \
            -DgenerateBackupPoms=false

      - name: Build and verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Create next version branch
        env:
          NEXT_BRANCH: ${{ steps.next.outputs.branch }}
          NEXT_VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$NEXT_BRANCH"

          git add pom.xml
          git commit -m "chore: prepare $NEXT_VERSION"

          git push origin "$NEXT_BRANCH"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_BRANCH: ${{ steps.next.outputs.branch }}
          NEXT_VERSION: ${{ steps.next.outputs.version }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          gh pr create \
            --base main \
            --head "$NEXT_BRANCH" \
            --title "chore: prepare $NEXT_VERSION" \
            --body "## Next development version

          Following the successful release of v$RELEASE_VERSION.

          - [x] Update Maven version to $NEXT_VERSION
          - [x] Maven verification successful
          - [ ] Review changes
          - [ ] Merge PR"
